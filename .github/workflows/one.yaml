name: demo to call reusable workflow
on:
    push:
jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
            - name: from first job
              run: echo "hi i am from frst job step"
    second_job:
        runs-on: ubuntu-latest
        needs: first_job
        steps:
            - name: from second job
              run: echo "hi i am from second job step"

    calling_reusable_workflow_job:
        uses: ./.github/workflows/two.yml