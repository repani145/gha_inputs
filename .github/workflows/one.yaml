name: demo to call reusable workflow
on:
    workflow_dispatch:
      inputs:
        name:
            description: enter your name
            required: true
            type: string
        age:
            description: anter your age
            required: true
            type: number
        

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
            - name: from first job
              run: echo "hi i am from frst job step NAME:${{inputs.name}}"
    second_job:
        runs-on: ubuntu-latest
        needs: 
            - first_job
        steps:
            - name: from second job
              run: echo "hi i am from second job step AGE:${{inputs.age}}"

    calling_reusable_workflow_job:
        needs:
            - second_job
        uses: ./.github/workflows/two.yml
        with:
            first_name: ${{inputs.name}}
            last_name: ${{inputs.name}}